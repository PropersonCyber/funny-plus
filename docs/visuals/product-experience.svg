<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="690" viewBox="0 0 1320 690">
<rect width="1320" height="690" fill="#f4f7fd" rx="24"/><text x="55" y="59" fill="#172033" font-size="28" font-weight="700">一趟旅行，咕噜始终在线</text><text x="55" y="94" fill="#64748b" font-size="17">产品体验概念示意 · 目标体验，非当前界面或实时数据</text>
<rect x="48" y="132" width="382" height="466" rx="25" fill="#ffffff" stroke="#ccd7ef" stroke-width="2"/><rect x="70" y="154" width="338" height="75" rx="16" fill="#4169f5"/><circle cx="103" cy="191" r="17" fill="#63e6e2"/><text x="132" y="185" fill="#ffffff" font-size="18" font-weight="700">你好，我是咕噜</text><text x="132" y="210" fill="#e4edff" font-size="14">今天想怎样开始旅行？</text><text x="78" y="272" fill="#172033" font-size="20" font-weight="700">① 和咕噜规划</text><rect x="78" y="296" width="322" height="88" rx="12" fill="#f0f4ff"/><text x="96" y="326" fill="#34466d" font-size="16">周末带爸妈去北京</text><text x="96" y="352" fill="#34466d" font-size="16">玩两天，不想走太多路</text><text x="78" y="424" fill="#64748b" font-size="15">自然表达需求 · 选择灵活或固定安排</text><rect x="78" y="465" width="150" height="47" rx="22" fill="#4169f5"/><text x="111" y="495" fill="#ffffff" font-size="16">生成计划</text>
<rect x="469" y="132" width="382" height="466" rx="25" fill="#ffffff" stroke="#ccd7ef" stroke-width="2"/><text x="499" y="185" fill="#172033" font-size="20" font-weight="700">② 到达后发现</text><text x="499" y="214" fill="#64748b" font-size="15">已计划地点 + 当前位置匹配</text><rect x="499" y="243" width="322" height="90" rx="14" fill="#e8f8f6"/><text x="518" y="275" fill="#13776c" font-size="17" font-weight="700">附近值得吃 · 值得拍</text><text x="518" y="304" fill="#406c69" font-size="14">推荐理由 / 来源 / 待确认信息</text><rect x="499" y="353" width="322" height="87" rx="14" fill="#f3f0ff"/><text x="518" y="385" fill="#51419b" font-size="16">这里没什么可玩的</text><text x="518" y="412" fill="#6d678d" font-size="14">看看附近，还是去下一站？</text><rect x="499" y="470" width="155" height="44" rx="22" fill="#6657d8"/><text x="533" y="498" fill="#ffffff" font-size="15">继续下一站</text>
<rect x="890" y="132" width="382" height="466" rx="25" fill="#ffffff" stroke="#ccd7ef" stroke-width="2"/><text x="920" y="185" fill="#172033" font-size="20" font-weight="700">③ 留下回忆与攻略</text><rect x="920" y="218" width="322" height="112" rx="14" fill="#edf3ff"/><circle cx="954" cy="251" r="15" fill="#8b7cff"/><text x="980" y="252" fill="#30416c" font-size="16" font-weight="700">我的旅行回忆</text><text x="939" y="287" fill="#64748b" font-size="14">照片 · 文字 · 实际经历</text><text x="939" y="310" fill="#64748b" font-size="14">默认私人保存，随时补充</text><rect x="920" y="352" width="322" height="112" rx="14" fill="#e8f8f6"/><text x="939" y="386" fill="#13776c" font-size="16" font-weight="700">分享给别人的实用攻略</text><text x="939" y="414" fill="#406c69" font-size="14">选内容 → 编辑 → 预览 → 分享</text><text x="939" y="443" fill="#406c69" font-size="14">只公开用户确认的内容</text>
<text x="53" y="646" fill="#7a8aa4" font-size="14">说明：位置、推荐与交通依赖授权及数据可用性；画面为概念说明，不代表功能已上线。</text></svg>
